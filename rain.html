            const r = ripples[k];
            r.t += dt;
            r.r = r.max * (1 - Math.pow(1 - Math.min(1, r.t / r.life), 2));
            if (r.t > r.life) ripples.splice(k, 1);
          }
        }

        function rain(layer) {
          ctx.lineCap = 'round';
          for (const d of drops) {
            if (d.layer !== layer) continue;
            const tailX = d.x - UX * d.len, tailY = d.y - UY * d.len;
            const g = ctx.createLinearGradient(tailX, tailY, d.x, d.y);
            g.addColorStop(0, I(0));
            g.addColorStop(1, I(d.a));
            ctx.strokeStyle = g;
            ctx.lineWidth = d.w;
            ctx.beginPath();
            ctx.moveTo(tailX, tailY);
            ctx.lineTo(d.x, d.y);
            ctx.stroke();
          }
        }

        function draw() {
          ctx.setTransform(1, 0, 0, 1, 0, 0);
          ctx.fillStyle = 'rgb(' + bg + ')';
          ctx.fillRect(0, 0, W, H);

          const gg = ctx.createRadialGradient(W / 2, sy(132), 0, W / 2, sy(132), BW * 0.6 * S);
          gg.addColorStop(0, I(0.1));
          gg.addColorStop(1, I(0));
          ctx.fillStyle = gg;
          ctx.fillRect(0, 0, W, H);

          rain(0);
          rain(1);

          outx.setTransform(1, 0, 0, 1, 0, 0);
          outx.clearRect(0, 0, outCv.width, outCv.height);
          outx.globalCompositeOperation = 'source-over';
          outx.drawImage(wmCv, 0, 0);
          outx.globalCompositeOperation = 'destination-in';
          outx.drawImage(revCv, 0, 0);
          ctx.drawImage(outCv, reg.x, reg.y);

          // Puddle reflection. It is built on its own layer and faded by erasing its own
          // alpha, never by painting background over the scene - that used to leave a hard
          // seam where the covering rectangle ended and the glow reappeared underneath.
          refx.setTransform(1, 0, 0, 1, 0, 0);
          refx.clearRect(0, 0, refCv.width, refCv.height);
          refx.save();
          refx.translate(0, groundY * 1.5 - refTop);
          refx.scale(1, -0.5);
          refx.drawImage(outCv, reg.x, reg.y);
          refx.restore();

          refx.globalCompositeOperation = 'destination-out';
          const fade = refx.createLinearGradient(0, 0, 0, refCv.height);
          fade.addColorStop(0, 'rgba(0,0,0,0)');
          fade.addColorStop(0.45, 'rgba(0,0,0,.45)');
          fade.addColorStop(1, 'rgba(0,0,0,1)');
          refx.fillStyle = fade;
          refx.fillRect(0, 0, refCv.width, refCv.height);
          refx.globalCompositeOperation = 'source-over';

          ctx.save();
          ctx.globalAlpha = 0.22 * K;
          ctx.drawImage(refCv, 0, refTop);
          ctx.restore();

          const gl = ctx.createLinearGradient(sx(BX - 20), 0, sx(BX + BW + 20), 0);
          gl.addColorStop(0, I(0));
          gl.addColorStop(0.5, I(0.25));
          gl.addColorStop(1, I(0));
          ctx.fillStyle = gl;
          ctx.fillRect(sx(BX - 20), groundY, (BW + 40) * S, Math.max(1, S));

          ctx.lineWidth = Math.max(1, S);                     // puddle ripples
          for (const r of ripples) {
            ctx.strokeStyle = I(0.45 * (1 - r.t / r.life));
            ctx.beginPath();
            ctx.ellipse(r.x, groundY, r.r, r.r * 0.26, 0, 0, 7);
            ctx.stroke();
          }

          for (const p of parts) {                            // ricochet droplets as teardrops
            const sp = (Math.hypot(p.vx, p.vy) || 1) * 16 / S;
            const rx = p.ry * (1.7 + Math.min(1.3, sp * 0.055));  // faster droplet, more drawn out
            ctx.fillStyle = I(0.95 * (1 - p.t / p.life));
            ctx.beginPath();
            ctx.ellipse(p.x, p.y, rx, p.ry, Math.atan2(p.vy, p.vx), 0, 7);
            ctx.fill();
          }

          for (const fl of flashes) {                         // brief spark at the contact point
            const q = fl.t / fl.life;
            ctx.fillStyle = I(0.95 * (1 - q));
            ctx.beginPath();
            ctx.arc(fl.x, fl.y, 1.9 * S * (1 - q), 0, 7);
            ctx.fill();
          }

          rain(2);

          const shown = Math.min(1, Math.max(0, (hitCount / PTS.length - 0.55) / 0.35));
          ctx.fillStyle = I(0.45 * shown);
          ctx.font = (12.5 * S) + 'px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace';
          ctx.textAlign = 'center';
          ctx.fillText(TAG, W / 2, sy(BY + BH + 116));
        }

        // ----------------------------------------------------------------- loop
        function frame(now) {
          raf = requestAnimationFrame(frame);
          if (!t0) t0 = prev = now;
          const dt = Math.min(50, now - prev);
          prev = now;
          step(dt);
          draw();
        }

        function still() {                                    // prefers-reduced-motion
          blobs.length = 0;
          for (let i = 0; i < PTS.length; i++) {
            revealed[i] = 1;
            blobs.push({ i, r: BLOB, t: BGROW });
          }
          hitCount = PTS.length;
          repaintReveal();
          draw();
        }

        function restart() {
          drops = []; parts = []; ripples = []; flashes = []; blobs = [];
          revealed = new Uint8Array(PTS.length);
          claimed = new Uint8Array(PTS.length);
          hitCount = 0; seeded = 0; t0 = 0;
          repaintReveal();
          seedDrops();
        }

        addEventListener('resize', () => {
          resize();
          if (reduced.matches) still();
        });

        matchMedia('(prefers-color-scheme: light)').addEventListener('change', () => {
          palette();
          drawWordmark();
          if (reduced.matches) still();
        });

        addEventListener('click', () => {
          if (!reduced.matches) restart();
        });

        document.addEventListener('visibilitychange', () => {
          if (document.hidden) {
            cancelAnimationFrame(raf);
            raf = 0;
          } else if (!raf && !reduced.matches) {
            prev = performance.now();
            raf = requestAnimationFrame(frame);
          }
        });

        resize();
        if (reduced.matches) {
          still();
        } else {
          raf = requestAnimationFrame(frame);
          setTimeout(() => { hint.style.opacity = '.35'; }, 8000);
        }
      })();
      //]]>
    </script>
  </body>

</html>
